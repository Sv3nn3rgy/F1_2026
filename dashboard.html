<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Pool — Prediction League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<!-- Data generated by generate_dashboard_data.py; works via file:// (double-click) -->
<script src="dashboard_data.js"></script>
<style>
  :root{
    --accent:#FF2D2D;
    --bg0:#0E0E13; --bg1:#08080A;
    --card:#14141A; --line:rgba(255,255,255,0.07);
    --txt:#F4F4F7; --dim:#8A8A93; --dim2:#6A6A73;
    --hit:#27D67B; --partial:#F5A524; --miss:#FF5A5A;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    background:linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 60%);
    font-family:'Archivo',system-ui,sans-serif; color:var(--txt);
    padding:24px 24px 56px;
  }
  .wrap{max-width:1240px; margin:0 auto}
  .mono{font-family:'Space Mono',monospace}
  .row{display:flex}
  /* top bar */
  .topbar{display:flex; align-items:center; gap:18px; margin-bottom:22px; flex-wrap:wrap}
  .logo{display:flex; align-items:center; gap:10px}
  .logo .badge{width:30px;height:30px;border-radius:8px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;
    font-weight:700;font-size:16px;color:#0A0A0C}
  .logo .name{font-weight:900;font-size:19px;letter-spacing:.5px}
  .logo .name span{color:var(--accent)}
  .logo .tag{font-size:11px;letter-spacing:2px;color:var(--dim2);text-transform:uppercase}
  .standings{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
  .schip{display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:9px;
    background:rgba(255,255,255,.03);border:1px solid var(--line)}
  .schip .dot{width:9px;height:9px;border-radius:50%}
  .schip .nm{font-size:12px;font-weight:700}
  .schip .pt{font-family:'Space Mono',monospace;font-size:12px;color:var(--dim)}
  .schip.lead{background:rgba(255,45,45,.10);border-color:rgba(255,45,45,.35)}
  /* race selector */
  .selector{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .navbtn{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);color:var(--txt);font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.15s}
  .navbtn:hover:not(:disabled){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
  .navbtn:disabled{opacity:.3;cursor:default}
  .tabs{flex:1;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .tab{flex:none;min-width:96px;cursor:pointer;padding:8px 13px;border-radius:10px;
    background:rgba(255,255,255,.03);border:1px solid var(--line);
    display:flex;flex-direction:column;gap:3px;transition:.15s}
  .tab:hover{background:rgba(255,255,255,.06)}
  .tab.active{background:rgba(255,45,45,.12);border-color:rgba(255,45,45,.45)}
  .tab .rnd{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--dim2)}
  .tab.active .rnd{color:var(--accent)}
  .tab .tn{font-weight:700;font-size:13px;white-space:nowrap}
  .tab .ty{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
  .slider{display:flex;align-items:center;gap:10px;margin-bottom:30px}
  .slider input[type=range]{flex:1;accent-color:var(--accent);height:4px;cursor:pointer}
  .slider .scount{font-family:'Space Mono',monospace;font-size:12px;color:var(--dim);min-width:54px;text-align:right}
  /* title */
  .titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    padding-bottom:22px;margin-bottom:26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .meta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .meta .rd{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent)}
  .meta .sep{width:5px;height:5px;border-radius:50%;background:#3A3A42}
  .meta .dt{font-size:12px;letter-spacing:1px;color:var(--dim)}
  .ptype{font-size:11px;font-weight:700;letter-spacing:2px;padding:3px 9px;border-radius:6px;text-transform:uppercase}
  .ptype.race{background:rgba(255,45,45,.14);color:var(--accent)}
  .ptype.sprint{background:rgba(177,75,255,.16);color:#C58BFF}
  h1.gp{margin:0;font-weight:900;font-size:48px;line-height:.95;letter-spacing:-1.4px;text-transform:uppercase}
  .circuit{margin-top:12px;font-size:13px;color:var(--dim)}
  .legend{display:flex;gap:10px;flex-wrap:wrap}
  .lg{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:9px;font-size:12px;font-weight:700}
  .lg.hit{background:rgba(39,214,123,.08);border:1px solid rgba(39,214,123,.25);color:var(--hit)}
  .lg.partial{background:rgba(245,165,36,.08);border:1px solid rgba(245,165,36,.25);color:var(--partial)}
  .lg.miss{background:rgba(255,90,90,.06);border:1px solid rgba(255,90,90,.18);color:var(--miss)}
  /* section heading */
  .shead{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  .shead .t{font-weight:800;font-size:13px;letter-spacing:3px;text-transform:uppercase}
  .shead .s{font-size:11px;letter-spacing:1.5px;color:var(--dim2);text-transform:uppercase}
  .shead .ln{flex:1;height:1px;background:var(--line)}
  /* result cards */
  .heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:38px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .hero .bar{height:4px}
  .hero .body{padding:15px;display:flex;flex-direction:column;gap:13px}
  .hero .top{display:flex;align-items:center;justify-content:space-between}
  .hero .sub{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--dim);text-transform:uppercase}
  .hero .pos{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-weight:700;font-size:15px;color:#0A0A0C}
  .hero .drv{font-weight:800;font-size:25px;line-height:1;letter-spacing:-.5px}
  .hero .team{margin-top:9px;display:flex;align-items:center;gap:7px;font-size:12px;color:#9A9AA5}
  .hero .team .d{width:8px;height:8px;border-radius:50%}
  .hero .team .code{font-family:'Space Mono',monospace;font-size:12px;color:#5A5A63;margin-left:auto}
  /* predictions table */
  .pgrid{display:flex;flex-direction:column;gap:10px}
  .phead{display:flex;gap:10px;padding:0 14px 6px}
  .pcol-name{width:180px;flex:none;display:flex;align-items:flex-end;
    font-size:10px;letter-spacing:2px;color:var(--dim2);text-transform:uppercase;font-weight:700}
  .slots{flex:1;display:flex;gap:10px}
  .slot-h{flex:1;min-width:0;background:rgba(255,255,255,.022);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
  .slot-h .l{display:flex;align-items:center;justify-content:space-between}
  .slot-h .lab{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;color:#C5C5CC;letter-spacing:1px}
  .slot-h .sb{font-size:9px;letter-spacing:1.5px;color:#5A5A63;text-transform:uppercase}
  .slot-h .a{display:flex;align-items:center;gap:7px}
  .slot-h .a .bar{width:3px;height:14px;border-radius:2px}
  .slot-h .a .code{font-family:'Space Mono',monospace;font-weight:700;font-size:13px}
  .slot-h .a .x{font-size:9px;letter-spacing:1px;color:#5A5A63;margin-left:auto;text-transform:uppercase}
  .pcol-pts{width:84px;flex:none;display:flex;align-items:flex-end;justify-content:center;
    font-size:10px;letter-spacing:2px;color:var(--dim2);text-transform:uppercase;font-weight:700}
  .prow{display:flex;gap:10px;align-items:stretch;border-radius:14px;padding:12px 14px;
    background:#101015;border:1px solid var(--line)}
  .prow.lead{background:rgba(255,45,45,.08);border-color:rgba(255,45,45,.33)}
  .pname{width:180px;flex:none;display:flex;align-items:center;gap:11px}
  .pname .rk{width:32px;height:32px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-family:'Space Mono',monospace;font-weight:700;font-size:12px;background:rgba(255,255,255,.07);color:#C5C5CC}
  .prow.lead .pname .rk{background:var(--accent);color:#0A0A0C}
  .pname .av{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;background:rgba(255,255,255,.06);color:#C5C5CC;border:1px solid transparent}
  .pname .nm{font-weight:700;font-size:15px}
  .pname .sl{font-size:11px;color:#7A7A83;margin-top:2px}
  .pick{flex:1;min-width:0;position:relative;border-radius:10px;padding:10px 10px 10px 16px;
    display:flex;flex-direction:column;gap:4px;min-height:74px}
  .pick .vbar{position:absolute;left:7px;top:10px;bottom:10px;width:3px;border-radius:3px}
  .pick .l{display:flex;align-items:center;justify-content:space-between}
  .pick .code{font-family:'Space Mono',monospace;font-weight:700;font-size:17px;letter-spacing:.5px}
  .pick .ic{font-size:13px;font-weight:700}
  .pick .dn{font-size:12px;color:#9A9AA5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pick .pts{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;margin-top:auto}
  .pick.hit{background:rgba(39,214,123,.10);border:1px solid rgba(39,214,123,.38)}
  .pick.partial{background:rgba(245,165,36,.10);border:1px solid rgba(245,165,36,.34)}
  .pick.miss{background:rgba(255,90,90,.05);border:1px solid rgba(255,90,90,.15)}
  .ptot{width:84px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border-radius:11px;background:rgba(255,255,255,.025)}
  .prow.lead .ptot{background:rgba(255,45,45,.12)}
  .ptot .v{font-family:'Space Mono',monospace;font-weight:700;font-size:28px;line-height:1}
  .ptot .u{font-size:9px;letter-spacing:2px;color:#7A7A83;text-transform:uppercase}
  .err{padding:40px;text-align:center;color:var(--dim)}
  /* page tabs */
  .pagetabs{margin-left:auto;display:flex;gap:6px;background:rgba(255,255,255,.03);
    border:1px solid var(--line);border-radius:11px;padding:4px}
  .ptab{border:none;background:transparent;color:var(--dim);font-family:'Archivo',sans-serif;
    font-weight:700;font-size:13px;letter-spacing:.3px;padding:8px 16px;border-radius:8px;cursor:pointer;transition:.15s}
  .ptab:hover{color:var(--txt)}
  .ptab.active{background:var(--accent);color:#0A0A0C}
  /* stats page */
  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;height:330px;margin-bottom:34px}
  .ptable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
  table.pts{border-collapse:collapse;width:100%;font-size:11px}
  table.pts .cum{font-family:'Space Mono',monospace}
  table.pts .gain{margin-left:5px;font-size:9px;color:var(--dim2)}
  table.pts .gain.zero{opacity:.45}
  table.pts th,table.pts td{padding:10px 12px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
  table.pts th{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--dim2);
    font-weight:700;background:#101015;position:sticky;top:0}
  table.pts td.player,table.pts th.player{text-align:left;font-weight:700;position:sticky;left:0;background:#101015;z-index:1}
  table.pts td.zero{color:var(--dim2)}
  table.pts tr:last-child td{border-bottom:none}
  table.pts tr.lead td{background:rgba(255,45,45,.08)}
  table.pts tr.lead td.player{color:var(--accent);background:#15090b}
  table.pts .pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  @media(max-width:760px){
    h1.gp{font-size:34px}
    .pcol-name,.pname{width:120px}
    .pick .dn{display:none}
    .slot-h .sb{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="logo">
      <span class="badge">P</span>
      <span class="name">Family<span>·</span>Pool</span>
      <span class="tag">Prediction League</span>
    </div>
    <div class="pagetabs" id="pageTabs">
      <button class="ptab active" data-page="race">Race Details</button>
      <button class="ptab" data-page="stats">Stats</button>
    </div>
  </div>

  <div id="pageRace">
    <div class="selector">
      <button class="navbtn" id="prevBtn" title="Previous race">‹</button>
      <div class="tabs" id="tabs"></div>
      <button class="navbtn" id="nextBtn" title="Next race">›</button>
    </div>
    <div class="slider">
      <input type="range" id="raceSlider" min="0" max="0" value="0">
      <span class="scount mono" id="sliderCount">1 / 1</span>
    </div>
    <div id="raceView"></div>
  </div>

  <div id="pageStats" style="display:none">
    <div class="shead"><span class="t">Points table</span><span class="s">best player on top</span><span class="ln"></span></div>
    <div id="pointsTable" class="ptable-wrap"></div>

    <div class="shead" style="margin-top:30px"><span class="t">Total points progression</span><span class="s">cumulative</span><span class="ln"></span></div>
    <div class="chartbox"><canvas id="lineChart"></canvas></div>

    <div class="shead"><span class="t">Points per race</span><span class="s">bars per player</span><span class="ln"></span></div>
    <div class="chartbox"><canvas id="barChart"></canvas></div>
  </div>
</div>

<script>
// ---- driver metadata: lastname -> code, team, color ----
const DRIVERS = {
  Verstappen:{code:'VER',team:'Red Bull',color:'#3671C6'},
  Norris:{code:'NOR',team:'McLaren',color:'#FF8000'},
  Piastri:{code:'PIA',team:'McLaren',color:'#FF8000'},
  Leclerc:{code:'LEC',team:'Ferrari',color:'#E80020'},
  Hamilton:{code:'HAM',team:'Ferrari',color:'#E80020'},
  Russell:{code:'RUS',team:'Mercedes',color:'#27F4D2'},
  Antonelli:{code:'ANT',team:'Mercedes',color:'#27F4D2'},
  Alonso:{code:'ALO',team:'Aston Martin',color:'#229971'},
  Stroll:{code:'STR',team:'Aston Martin',color:'#229971'},
  Gasly:{code:'GAS',team:'Alpine',color:'#0093CC'},
  Colapinto:{code:'COL',team:'Alpine',color:'#0093CC'},
  Albon:{code:'ALB',team:'Williams',color:'#64C4FF'},
  Sainz:{code:'SAI',team:'Williams',color:'#64C4FF'},
  Ocon:{code:'OCO',team:'Haas',color:'#B6BABD'},
  Bearman:{code:'BEA',team:'Haas',color:'#B6BABD'},
  Tsunoda:{code:'TSU',team:'Racing Bulls',color:'#6692FF'},
  Hadjar:{code:'HAD',team:'Racing Bulls',color:'#6692FF'},
  Lawson:{code:'LAW',team:'Racing Bulls',color:'#6692FF'},
  Hulkenberg:{code:'HUL',team:'Audi',color:'#52E252'},
  Bortoleto:{code:'BOR',team:'Audi',color:'#52E252'},
  Perez:{code:'PER',team:'Cadillac',color:'#C5A572'},
  Bottas:{code:'BOT',team:'Cadillac',color:'#C5A572'},
};
function drv(name){
  if(!name) return {code:'—',team:'',color:'#5A5A63',name:'—'};
  const d = DRIVERS[name];
  if(d) return {...d,name};
  return {code:name.slice(0,3).toUpperCase(),team:'',color:'#7A7A83',name};
}
const POS_COLOR={POLE:'#B14BFF',P1:'#F5C544',P2:'#C7CDD6',P3:'#C8854B'};
const SLOT_SUB={POLE:'Qualifying',P1:'Winner',P2:'Second',P3:'Third',BONUS:'Bonus driver'};
const POS_NUM={POLE:'Q',P1:'1',P2:'2',P3:'3'};
const ICON={hit:'✓',partial:'≈',miss:'✕'};

let DATA=null, races=[], idx=0;

async function boot(){
  try{
    if(window.DASHBOARD_DATA){ DATA=window.DASHBOARD_DATA; }
    else{
      const r=await fetch('dashboard_data.json'); if(!r.ok) throw new Error('HTTP '+r.status);
      DATA=await r.json();
    }
    races=DATA.race_details||[];
    if(!races.length){ document.getElementById('raceView').innerHTML='<div class="err">No race data yet. Run generate_dashboard_data.py.</div>'; return; }
    idx=races.length-1; // start at most recent
    document.querySelectorAll('.ptab').forEach(t=>t.addEventListener('click',()=>switchPage(t.dataset.page)));
    buildSelector();
    render();
  }catch(e){
    document.getElementById('raceView').innerHTML='<div class="err">Could not load data ('+e.message+').<br>Run <code>python generate_dashboard_data.py</code> and open via the dashboard_data.js file alongside this page.</div>';
    console.error(e);
  }
}

function switchPage(pg){
  document.querySelectorAll('.ptab').forEach(t=>t.classList.toggle('active',t.dataset.page===pg));
  document.getElementById('pageRace').style.display = pg==='race' ? '' : 'none';
  document.getElementById('pageStats').style.display = pg==='stats' ? '' : 'none';
  if(pg==='stats') renderStats();
}

let statsBuilt=false;
function shortLabel(r){return r.grand_prix.replace(' GP','')+' '+r.race_type[0];}

function renderStats(){
  if(statsBuilt) return;
  statsBuilt=true;

  const rd=DATA.race_details||[];
  const rp=DATA.race_points||[];           // same order/length as race_details
  const players=(DATA.players||[]).slice();
  const colors=DATA.player_colors||{};
  const labels=rd.map(shortLabel);
  const ptsOf=(r,p)=> (r && r.points_by_player && r.points_by_player[p]!=null) ? r.points_by_player[p] : 0;

  // ----- points table (best player on top) -----
  const totals={}; players.forEach(p=>totals[p]=rp.reduce((s,r)=>s+ptsOf(r,p),0));
  const order=players.slice().sort((a,b)=>totals[b]-totals[a]);
  // newest race first: its running total is the season total, so no separate Total column
  let head='<tr><th class="player">Player</th>'
    +labels.slice().reverse().map(l=>`<th>${l}</th>`).join('')+'</tr>';
  let body=order.map((p,i)=>{
    // each cell shows the running total after that race, plus what the race itself scored
    let run=0;
    const cells=rp.map(r=>{const v=ptsOf(r,p);run+=v;
      return `<td><span class="cum">${run}</span><span class="gain${v===0?' zero':''}">+${v}</span></td>`;})
      .reverse().join('');
    return `<tr class="${i===0?'lead':''}">
      <td class="player"><span class="pdot" style="background:${colors[p]||'#888'}"></span>${p}</td>
      ${cells}</tr>`;
  }).join('');
  document.getElementById('pointsTable').innerHTML=`<table class="pts"><thead>${head}</thead><tbody>${body}</tbody></table>`;

  if(typeof Chart==='undefined'){
    document.querySelectorAll('.chartbox').forEach(c=>c.innerHTML='<div class="err">Charts need internet to load Chart.js.</div>');
    return;
  }
  Chart.defaults.font.family="'Archivo',sans-serif";
  const grid='rgba(255,255,255,0.06)', tick='#8A8A93';
  const axes={x:{grid:{color:grid},ticks:{color:tick,font:{size:10}}},
              y:{grid:{color:grid},ticks:{color:tick},beginAtZero:true}};
  const legend={labels:{color:'#C5C5CC',usePointStyle:true,pointStyleWidth:10,boxHeight:7}};

  // ----- bar chart: points per race -----
  new Chart(document.getElementById('barChart'),{
    type:'bar',
    data:{labels,datasets:players.map(p=>({label:p,data:rp.map(r=>ptsOf(r,p)),
      backgroundColor:colors[p]||'#888',borderRadius:4,maxBarThickness:20}))},
    options:{responsive:true,maintainAspectRatio:false,scales:axes,
      plugins:{legend:{position:'top',...legend}}}
  });

  // ----- line chart: cumulative total points -----
  const cum={}; players.forEach(p=>cum[p]=0);
  const lineData={}; players.forEach(p=>lineData[p]=[]);
  rp.forEach(r=>players.forEach(p=>{cum[p]+=ptsOf(r,p);lineData[p].push(cum[p]);}));
  new Chart(document.getElementById('lineChart'),{
    type:'line',
    data:{labels,datasets:players.map(p=>({label:p,data:lineData[p],
      borderColor:colors[p]||'#888',backgroundColor:colors[p]||'#888',
      tension:.3,borderWidth:2,pointRadius:2,fill:false}))},
    options:{responsive:true,maintainAspectRatio:false,scales:axes,
      plugins:{legend:{position:'top',...legend}}}
  });
}

function buildSelector(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=races.map((r,i)=>`
    <div class="tab" data-i="${i}">
      <span class="rnd">R${String(r.round||i+1).padStart(2,'0')}</span>
      <span class="tn">${r.grand_prix.replace(' GP','')}</span>
      <span class="ty">${r.race_type}</span>
    </div>`).join('');
  tabs.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{idx=+t.dataset.i;render();}));
  const sl=document.getElementById('raceSlider');
  sl.max=races.length-1; sl.value=idx;
  sl.addEventListener('input',()=>{idx=+sl.value;render();});
  document.getElementById('prevBtn').addEventListener('click',()=>{if(idx>0){idx--;render();}});
  document.getElementById('nextBtn').addEventListener('click',()=>{if(idx<races.length-1){idx++;render();}});
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'&&idx>0){idx--;render();}
    if(e.key==='ArrowRight'&&idx<races.length-1){idx++;render();}
  });
}

function syncSelector(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.i===idx));
  const active=document.querySelector('.tab.active'); if(active) active.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  document.getElementById('raceSlider').value=idx;
  document.getElementById('sliderCount').textContent=(idx+1)+' / '+races.length;
  document.getElementById('prevBtn').disabled=idx===0;
  document.getElementById('nextBtn').disabled=idx===races.length-1;
}

function fmtDate(s){
  if(!s) return '';
  const d=new Date(s+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}).toUpperCase();
}

function render(){
  syncSelector();
  const r=races[idx];
  const isRace=r.race_type==='Race';
  const slots=isRace?['POLE','P1','P2','P3','BONUS']:['POLE','P1','P2','P3'];

  // hero result cards (Pole/P1/P2/P3 + optional bonus driver)
  const heroSlots=['POLE','P1','P2','P3'];
  let heroes=heroSlots.map(s=>{
    const key=s.toLowerCase();
    const d=drv(r.actual[key]);
    return `<div class="hero">
      <div class="bar" style="background:${d.color}"></div>
      <div class="body">
        <div class="top">
          <span class="sub">${SLOT_SUB[s]}</span>
          <span class="pos" style="background:${POS_COLOR[s]}">${POS_NUM[s]}</span>
        </div>
        <div>
          <div class="drv">${d.name}</div>
          <div class="team"><span class="d" style="background:${d.color}"></span>${d.team||'—'}<span class="code">${d.code}</span></div>
        </div>
      </div></div>`;
  }).join('');
  if(isRace && r.bonus_driver){
    const d=drv(r.bonus_driver);
    heroes+=`<div class="hero">
      <div class="bar" style="background:${d.color}"></div>
      <div class="body">
        <div class="top">
          <span class="sub">Bonus driver</span>
          <span class="pos" style="background:#5A5A63;color:#F4F4F7">${(r.bonus_actual_pos||'?').replace('P','')}</span>
        </div>
        <div>
          <div class="drv">${d.name}</div>
          <div class="team"><span class="d" style="background:${d.color}"></span>finished ${r.bonus_actual_pos||'—'}<span class="code">${d.code}</span></div>
        </div>
      </div></div>`;
  }

  // predictions header
  const slotHead=slots.map(s=>{
    if(s==='BONUS'){
      const d=drv(r.bonus_driver);
      return `<div class="slot-h">
        <div class="l"><span class="lab">BONUS</span><span class="sb">${d.name}</span></div>
        <div class="a"><span class="bar" style="background:${d.color}"></span><span class="code" style="color:${d.color}">${d.code}</span><span class="x">${r.bonus_actual_pos||''}</span></div>
      </div>`;
    }
    const d=drv(r.actual[s.toLowerCase()]);
    return `<div class="slot-h">
      <div class="l"><span class="lab">${s}</span><span class="sb">${SLOT_SUB[s]}</span></div>
      <div class="a"><span class="bar" style="background:${d.color}"></span><span class="code">${d.code}</span><span class="x">Actual</span></div>
    </div>`;
  }).join('');

  // player rows
  const rows=r.players.map((p,i)=>{
    const lead=i===0;
    const initials=p.name.length<=2?p.name.toUpperCase():p.name.slice(0,2).toUpperCase();
    const exact=p.picks.filter(x=>x.state==='hit').length;
    const close=p.picks.filter(x=>x.state==='partial').length;
    const sub=exact+' exact'+(close?' · '+close+' close':'');
    const picks=p.picks.map(pk=>{
      const d=drv(pk.pred);
      const isBonus=pk.slot==='BONUS';
      const main=isBonus?(pk.predPos||'—'):d.code;
      const dn=isBonus?(d.name+' '+(pk.predPos||'')):d.name;
      const ptsCol=pk.state==='hit'?'var(--hit)':pk.state==='partial'?'var(--partial)':'#6A6A73';
      const pts=(pk.score>0?'+':'')+pk.score;
      return `<div class="pick ${pk.state}">
        <span class="vbar" style="background:${pk.state==='miss'?'#3A3A42':d.color}"></span>
        <div class="l"><span class="code" style="color:${pk.state==='miss'?'#8A8A93':'#F4F4F7'}">${main}</span><span class="ic" style="color:${ptsCol}">${ICON[pk.state]}</span></div>
        <span class="dn">${dn}</span>
        <span class="pts" style="color:${ptsCol}">${pts} pts</span>
      </div>`;
    }).join('');
    const pc=(DATA.player_colors||{})[p.name]||'#888';
    return `<div class="prow ${lead?'lead':''}">
      <div class="pname">
        <span class="rk">P${i+1}</span>
        <span class="av" style="border-color:${lead?'var(--accent)':'transparent'}">${initials}</span>
        <div><div class="nm">${p.name}</div><div class="sl">${sub}</div></div>
      </div>
      <div class="slots">${picks}</div>
      <div class="ptot"><span class="v" style="color:${lead?'var(--accent)':'#F4F4F7'}">${p.total}</span><span class="u">pts</span></div>
    </div>`;
  }).join('');

  document.getElementById('raceView').innerHTML=`
    <div class="titlebar">
      <div>
        <div class="meta">
          <span class="rd">ROUND ${String(r.round||idx+1).padStart(2,'0')}</span>
          <span class="sep"></span><span class="dt">${fmtDate(r.date)}</span>
          <span class="ptype ${isRace?'race':'sprint'}">${r.race_type}</span>
        </div>
        <h1 class="gp">${(r.display_name||r.grand_prix)}</h1>
        <div class="circuit">${r.circuit||''}</div>
      </div>
      <div class="legend">
        <span class="lg hit">✓ Exact</span>
        <span class="lg partial">≈ On podium</span>
        <span class="lg miss">✕ Miss</span>
      </div>
    </div>

    <div class="shead"><span class="t">Race Result</span><span class="s">Official — the answer key</span><span class="ln"></span></div>
    <div class="heroes">${heroes}</div>

    <div class="shead"><span class="t">Predictions</span><span class="s">${r.players.length} players · ranked by points</span><span class="ln"></span></div>
    <div class="phead"><div class="pcol-name">Player</div><div class="slots">${slotHead}</div><div class="pcol-pts">Points</div></div>
    <div class="pgrid">${rows}</div>`;
}

boot();
</script>
</body>
</html>
